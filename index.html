<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesWeb - Av2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            font-size: 1.1rem;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            font-size: 1.1rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        /* Área de Resultado */
        #resultado {
            margin-top: 2rem;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Estilização das Fontes Grandes (Notas) */
        .nota-alta {
            font-size: 4rem;
            font-weight: bold;
            color: #064e3b; /* Verde Escuro */
        }

        .nota-baixa {
            font-size: 4rem;
            font-weight: bold;
            color: #ea580c; /* Laranja */
        }

        /* Casos Especiais */
        .erro {
            font-size: 1.2rem;
            font-weight: 600;
            color: #dc2626;
        }

        .mensagem-sub {
            font-size: 1.05rem;
            color: #475569;
            margin-top: 0.8rem;
            font-style: italic;
            font-weight: 500;
            line-height: 1.4;
            max-width: 90%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DesWeb - Av2</h1>
        
        <div class="form-group">
            <input type="text" id="matriculaInput" placeholder="Digite a matrícula (5 dígitos)" maxlength="5">
        </div>
        
        <button onclick="verificarNota()">Consultar</button>

        <div id="resultado"></div>
    </div>

    <script>
        // Base de dados atualizada com os feedbacks completos fornecidos
        const baseDados = {
            "16045": { nota: 10, msg: "Muito criativo, parabéns!" },
            "38202": { nota: 0,  msg: "" },
            "44069": { nota: 10, msg: "Bem bacana, parabéns!" },
            "41878": { nota: 7,  msg: "Bonita organização e estética, parabéns. Os links não funcionam." },
            "42140": { nota: 7,  msg: "Bem diagramado, parabéns. Os links não funcionam. Ficou divertido!" },
            "41752": { nota: -1, msg: "Venha conversar comigo - envio duplicado" },
            "39478": { nota: 0,  msg: "" },
            "42097": { nota: 9,  msg: "Ficou muito bom, poderia ter aproveitado melhor as imagens originais ao invés de emojis" },
            "42551": { nota: 7,  msg: "Bonita organização e estética, parabéns. Os links não funcionam." },
            "45220": { nota: 7,  msg: "A interatividade está boa. As imagens estão quebradas" },
            "45405": { nota: -1, msg: "Venha conversar comigo - envio após o horário" },
            "42946": { nota: 8,  msg: "Ficou muito bom, poderia ter aproveitado as imagens originais" },
            "39148": { nota: 10, msg: "Bem bacana, parabéns!" },
            "39472": { nota: 10, msg: "Mandou bem hein!" },
            "45124": { nota: 0,  msg: "" },
            "42174": { nota: 0,  msg: "" },
            "35384": { nota: 9,  msg: "Ficou muito bom, poderia ter aproveitado as imagens originais" },
            "38164": { nota: 10, msg: "Excelente, boa estética!" },
            "39509": { nota: 10, msg: "Ficou criativo, parabéns!" },
            "38199": { nota: -1, msg: "Venha conversar comigo - URL errada" },
            "31520": { nota: 10, msg: "Muito bom, bem interativo parabéns!" },
            "39275": { nota: 8,  msg: "Bom, mas poderia ser melhor. Por exemplo, não aproveitou imagens originais e havia uma imagem quebrada (ref. Errada)" },
            "45506": { nota: 7,  msg: "Boa estática. Imagens quebradas" },
            "42093": { nota: 10, msg: "Muito bom e funcional, parabéns!" },
            "38101": { nota: 10, msg: "Ficou excelente, parabéns!" },
            "38102": { nota: 7,  msg: "Ficou muito bom, poderia ter trabalhado melhor os cards" },
            "42961": { nota: 10, msg: "Muito bom e funcional, parabéns!" },
            "42344": { nota: 9,  msg: "Ficou muito bom, poderia ter aproveitado as imagens originais" }
        };

        function verificarNota() {
            const input = document.getElementById("matriculaInput").value.trim();
            const resultadoDiv = document.getElementById("resultado");
            
            // Limpa o resultado anterior
            resultadoDiv.innerHTML = "";

            // Validação básica do campo de texto
            if (input.length !== 5 || isNaN(input)) {
                resultadoDiv.innerHTML = `<p class="erro">Por favor, insira uma matrícula válida de 5 dígitos.</p>`;
                return;
            }

            // Verifica se a matrícula existe na base de dados
            if (baseDados.hasOwnProperty(input)) {
                const registro = baseDados[input];
                const nota = registro.nota;
                let mensagemExibida = registro.msg;

                // Caso 1: Nota igual a 0 (S/N + Mensagem original da substitutiva)
                if (nota === 0) {
                    resultadoDiv.innerHTML = `
                        <div class="nota-baixa">S/N</div>
                        <div class="mensagem-sub">Você requereu a sub?</div>
                    `;
                } 
                // Caso 2: Nota maior ou igual a 7.0 (Verde Escuro)
                else if (nota >= 7.0) {
                    const notaFormatada = nota.toFixed(1).replace('.', ',');
                    resultadoDiv.innerHTML = `
                        <div class="nota-alta">${notaFormatada}</div>
                        ${mensagemExibida ? `<div class="mensagem-sub">"${mensagemExibida}"</div>` : ''}
                    `;
                } 
                // Caso 3: Nota abaixo de 7.0 (Laranja) - Inclui notas negativas como o -1
                else {
                    const notaFormatada = nota.toFixed(1).replace('.', ',');
                    resultadoDiv.innerHTML = `
                        <div class="nota-baixa">${notaFormatada}</div>
                        ${mensagemExibida ? `<div class="mensagem-sub">"${mensagemExibida}"</div>` : ''}
                    `;
                }
            } 
            // Caso 4: Matrícula não encontrada
            else {
                resultadoDiv.innerHTML = `<p class="erro">Matrícula errada.</p>`;
            }
        }

        // Permite pressionar "Enter" no teclado para submeter o formulário
        document.getElementById("matriculaInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarNota();
            }
        });
    </script>

</body>
</html>
